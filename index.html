<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Shop Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Nullscape Shop Calculator</h1>
    </header>

    <section aria-labelledby="controls-heading">
      <h2 id="controls-heading">Controls</h2>
      <div class="controls">
        <div class="field">
          <label for="current-money">Golden Gifts</label>
          <input id="current-money" name="current-money" type="number" placeholder="0">
        </div>

        <div class="field">
          <label for="current-level">Current Level</label>
          <input id="current-level" name="current-level" type="number" placeholder="1">
        </div>

        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" name="difficulty">
            <option>Casual</option>
            <option selected>Standard</option>
            <option>Extreme</option>
          </select>
        </div>

        <div class="field">
          <label for="player-count">Player Count</label>
          <input id="player-count" name="player-count" type="number" min="1" max="20" placeholder="1">
        </div>
      </div>
    </section>

    <section class="upgrades" aria-labelledby="upgrades-heading">
    <h2 id="upgrades-heading">Upgrades</h2>
        <div class="upgrade-grid" id="upgrade-grid"></div>
    </section>

    <div id="upgrade-tooltip" class="upgrade-tooltip" hidden></div>

<script src="./script.js" defer></script>
  </main>
</body>
</html>
