<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nullscape Shop Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
        <img
            class="title-image"
            src="https://static.wikitide.net/nullscapewiki/thumb/8/8d/Upgradesheader.png/1250px-Upgradesheader.png"
            alt="Nullscape Upgrades"
            width="1250"
            height="250"
        >
    </header>

    <section aria-labelledby="controls-heading">
      <div class="controls">
        <div class="field">
          <label for="current-level">Current Level</label>
          <input id="current-level" name="current-level" type="number" placeholder="3">
        </div>
        
        <div class="field">
          <label for="player-count">Player Count</label>
          <input id="player-count" name="player-count" type="number" min="1" max="20" placeholder="1">
        </div>
        
        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" name="difficulty">
            <option>Casual</option>
            <option selected>Standard</option>
            <option>Extreme</option>
          </select>
        </div>

        <div class="field">
          <label for="current-money">Golden Gifts</label>
          <input id="current-money" name="current-money" type="number" placeholder="0">
        </div>

      </div>
    </section>

    <section class="upgrades" aria-labelledby="upgrades-heading">
    <h2 id="upgrades-heading">Owned Upgrades</h2>
        <div class="upgrade-grid" id="upgrade-grid"></div>
    </section>

    <section class="shop" aria-labelledby="shop-heading">
  <h2 id="shop-heading">Shop</h2>
  <p id="shop-money" class="shop-money" aria-live="polite" aria-atomic="true"></p>
  <div class="shop-grid" id="shop-grid"></div>
</section>

    <div id="upgrade-tooltip" class="upgrade-tooltip" hidden></div>

<script src="./script.js" defer></script>
  </main>
</body>
</html>
